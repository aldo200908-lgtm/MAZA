<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#222620">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAZA — Tu agenda y tu barbería, en un mismo lugar.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MAZA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAZA · Tu día, en orden</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    body { margin: 0; background: #faf9f6; color: #222620; }
    #maza-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: .5rem;
      text-align: center;
      font-family: system-ui, sans-serif;
    }
    #maza-loading strong { font-size: 2rem; }
    #maza-loading span { font-size: .875rem; }
  </style>
</head>
<body>
  <div id="maza-loading" role="status">
    <strong>MAZA</strong>
    <span>Cargando…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('maza-loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
